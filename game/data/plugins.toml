# Plugin load order for the game AND the editor (chantier 4 B1: everything
# goes through data::loadPluginStack — écart n°1 of HORIZONTAL-PASS closed).
# Later plugins override earlier ones per FIELD (last writer wins, §5).
# Paths are relative to this data/ directory. Managed by the in-game plugin
# manager; hand-editing is fine too.

[[plugins]]
file = "base/landscape.toml"

[[plugins]]
file = "base/adventure.toml"

# Shared combat data (P0): abilities + fx/cue records used by BOTH the 3D
# game and the 2D benches (base.toml below is 2D-only and disabled here).
[[plugins]]
file = "base/combat.toml"

[[plugins]]
file = "base/village.toml"

[[plugins]]
file = "base/ui.toml"

# Player-facing strings (U4-11): authored in text-fr.csv, imported by
# `cooker import-csv text-fr.csv text-fr.toml LocStringForm <plugin-guid>`.
# A language pack = another plugin patching `text` on the same records.
[[plugins]]
file = "base/text-fr.toml"

# 2D test-scene data (WorldDemoScene / CombatArena load it directly);
# disabled in the 3D game stack — enable to inspect it in the Game DB.
[[plugins]]
file = "base/base.toml"
enabled = false

# Level-editor output: an ordinary mod layered on top. Absent on a fresh
# install — silently skipped until the first editor export.
[[plugins]]
file = "mods/level-edits.toml"
