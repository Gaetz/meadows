# Plugin load order for the game AND the editor (chantier 4 B1: everything
# goes through data::loadPluginStack — écart n°1 of HORIZONTAL-PASS closed).
# Later plugins override earlier ones per FIELD (last writer wins, §5).
# Paths are relative to this data/ directory. Managed by the in-game plugin
# manager; hand-editing is fine too.

[[plugins]]
file = "base/landscape.toml"

[[plugins]]
file = "base/adventure.toml"

# Shared combat data (P0): abilities + fx/cue records used by BOTH the 3D
# game and the 2D benches (base.toml below is 2D-only and disabled here).
[[plugins]]
file = "base/combat.toml"

[[plugins]]
file = "base/village.toml"

[[plugins]]
file = "base/ui.toml"

# Player-facing strings (U4-11 + C9.5): ENGLISH is the base language —
# text-en.csv holds every key, imported by
#   cooker import-csv text-en.csv text-en.toml LocStringForm \
#     18a05b5b-eda3-4267-bbac-318a1d3989e7
[[plugins]]
file = "base/text-en.toml"

# The FRENCH pack: an ordinary plugin PATCHING `text` on the text-en
# records (§5 — the canonical language-pack mechanism), regenerated by
#   cooker import-csv text-fr.csv text-fr.toml LocStringForm \
#     b754251d-39a5-40b3-9c1e-39d15a8125e8 \
#     --patch 18a05b5b-eda3-4267-bbac-318a1d3989e7
# Its enabled flag is GATED by settings.language (any text-<code>.toml
# pack is; settings.language defaults to "fr", and the options screen's
# Language toggle flips it live), so the game ignores an enabled= value
# written here for language packs.
[[plugins]]
file = "base/text-fr.toml"

# 2D test-scene data (WorldDemoScene / CombatArena load it directly);
# disabled in the 3D game stack — enable to inspect it in the Game DB.
[[plugins]]
file = "base/base.toml"
enabled = false

# Render-tuning overlay: written by the render panels' "Save render
# tuning" button (patches on the landscape.toml tuning records, §5 — one
# more layer, never an edit of base). Absent until the first save.
[[plugins]]
file = "mods/render-tuning.toml"

# Level-editor output: an ordinary mod layered on top. Absent on a fresh
# install — silently skipped until the first editor export.
[[plugins]]
file = "mods/level-edits.toml"

# Tree-type library: records CREATED by the Tree creation scene (one
# LobeTreeTuningForm/ColonizedTreeTuningForm per type — the singleton
# tuning records above stay the forest's source). Absent until the
# first save.
[[plugins]]
file = "mods/tree-types.toml"
