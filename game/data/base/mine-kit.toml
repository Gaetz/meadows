# True Adventurer — the mine kit (dungeon-gen, docs/DUNGEON-GEN.md).
# Base forms the dungeon generator instantiates for its gameplay anchors
# (resolved by editorId in DungeonGenTool::accept): the barrier a Locked
# corridor closes with, the lever that opens it, the prize chest, the ore
# item of Reward rooms, the trapped-miner flavor NPC. Enemies reuse the
# village Bandit. Ordinary records — retune or reskin them like any mod.

[plugin]
id = "9d0c4a50-0000-4000-8000-000000000001"
name = "mine-kit"

[assets]
"9d0c4a50-0000-4000-8000-0000000000a1" = "models/kit/MedievalVillageMegaKit/glTF/Prop_MetalFence_Simple.gltf"
"9d0c4a50-0000-4000-8000-0000000000a2" = "models/kit/MedievalVillageMegaKit/glTF/Prop_Support.gltf"

