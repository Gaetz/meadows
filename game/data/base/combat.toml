# True Adventurer — shared combat data (chantier P0): the abilities and
# feedback records BOTH stacks use. base.toml is the 2D test bench and is
# DISABLED in the 3D game stack (plugins.toml) — anything the landscape
# game needs must live here instead (the C2 lesson: records appended to a
# disabled plugin silently do not exist).

[plugin]
id = "c04ba7e0-1d52-4f6b-9a38-2e91c5d7f4b2"
name = "true-adventurer-combat"

[assets]
