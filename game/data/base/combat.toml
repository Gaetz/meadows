# True Adventurer — shared combat data (chantier P0): the abilities and
# feedback records BOTH stacks use. base.toml is the 2D test bench and is
# DISABLED in the 3D game stack (plugins.toml) — anything the landscape
# game needs must live here instead (the C2 lesson: records appended to a
# disabled plugin silently do not exist).

[plugin]
id = "c04ba7e0-1d52-4f6b-9a38-2e91c5d7f4b2"
name = "true-adventurer-combat"

# --- Dodge (Phase 8 Step 2): a self ability. Cost = energy; cooldown + i-frames
# are granted-tag effects; blockedTag=State.Exhausted gates it when out of energy.
[[records]]
form = "e0000000-0000-4000-8000-000000000010"
type = "EffectForm"
new = true
[records.fields]
editorId = "DodgeCost"
attribute = "energy"
op = "add"
magnitude = -25.0
duration = "instant"

[[records]]
form = "e0000000-0000-4000-8000-000000000011"
type = "EffectForm"
new = true
[records.fields]
editorId = "DodgeIFrames"
duration = "duration"
durationSeconds = 0.28
grantedTag = "State.Dodging"

[[records]]
form = "e0000000-0000-4000-8000-000000000012"
type = "EffectForm"
new = true
[records.fields]
editorId = "DodgeCooldown"
duration = "duration"
durationSeconds = 0.5
grantedTag = "Cooldown.Dodge"

[[records]]
form = "ab000000-0000-4000-8000-000000000002"
type = "AbilityForm"
new = true
[records.fields]
editorId = "Dodge"
cost = "e0000000-0000-4000-8000-000000000010"
cooldown = "e0000000-0000-4000-8000-000000000012"
effect = "e0000000-0000-4000-8000-000000000011"
blockedTag = "State.Exhausted"


# --- Player melee attack (Phase 8 Step 3). Cost + cooldown gate only; the actual
# typed damage is dealt by the scene's melee hitbox via applyDamage (not an effect).
[[records]]
form = "e0000000-0000-4000-8000-000000000020"
type = "EffectForm"
new = true
[records.fields]
editorId = "AttackCost"
attribute = "energy"
op = "add"
magnitude = -20.0
duration = "instant"

[[records]]
form = "e0000000-0000-4000-8000-000000000021"
type = "EffectForm"
new = true
[records.fields]
editorId = "AttackCooldown"
duration = "duration"
durationSeconds = 0.5
grantedTag = "Cooldown.Attack"

[[records]]
form = "ab000000-0000-4000-8000-000000000003"
type = "AbilityForm"
new = true
[records.fields]
editorId = "PlayerAttack"
cost = "e0000000-0000-4000-8000-000000000020"
cooldown = "e0000000-0000-4000-8000-000000000021"
blockedTag = "State.Exhausted"


# --- Particle effects (chantier P0 C1) — the FxRenderer demo pair; the
