# --- Cues (chantier P0 C2): the combat feedback LOOK, pure data. The
# FxDirector resolves emitted tags hierarchically ("Cue.Hit.Slash" falls
# back to "Cue.Hit") — a mod overrides the specific without touching C++.
[[records]]
form = "fc000000-0000-4000-8000-000000000001"
type = "CueForm"
new = true
[records.fields]
editorId = "CueHit"
tag = "Cue.Hit"
particles = "fe000000-0000-4000-8000-000000000001" # HitSparks
cameraShake = 0.15

[[records]]
form = "fc000000-0000-4000-8000-000000000002"
type = "CueForm"
new = true
[records.fields]
editorId = "CueBlock"
tag = "Cue.Block"
particles = "fe000000-0000-4000-8000-000000000001" # HitSparks (guard scrape)
cameraShake = 0.08

[[records]]
form = "fc000000-0000-4000-8000-000000000003"
type = "CueForm"
new = true
[records.fields]
editorId = "CueParry"
tag = "Cue.Parry"
particles = "fe000000-0000-4000-8000-000000000001" # HitSparks
cameraShake = 0.5

[[records]]
form = "fc000000-0000-4000-8000-000000000004"
type = "CueForm"
new = true
[records.fields]
editorId = "CueDeath"
tag = "Cue.Death"
particles = "fe000000-0000-4000-8000-000000000003" # DeathPuff

