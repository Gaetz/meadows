type = "EffectForm"
new = true
[records.fields]
editorId = "SneakCost"
attribute = "energy"
op = "add"
magnitude = -1.5
duration = "instant"

# --- The bow (chantier P0 A7): projectileSpeed > 0 makes a weapon
