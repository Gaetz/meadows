# True Adventurer — the 3D gameplay plugin (chantier 1, brick B1).
# An ordinary plugin (§5): everything the LandscapeScene spawns comes from
# these records — StaticForm props here, the NPC and its appearance in the
# later bricks. Loaded after landscape.toml; it may reference that plugin's
# asset guids (assets layer per guid, like fields).
#
# B1 convention: ReferenceForm.position.y is an offset ABOVE the terrain at
# (x, z) — the scene grounds every spawned prop (hand-authored heights come
# with the level editor, chantier 2).
#
# Chantier 2 (B1): the demo area is CELLED — 64 m cells (aligned on the
# terrain chunks) in the "Overworld" worldspace, loaded/unloaded around
# the player (CellStreamer). A reference with NO `cell` is PERSISTENT
# (spawned once at scene start — the player). gridY is the Z axis.

[plugin]
id = "7c9e2f40-3a1b-4c8d-9e5f-6a7b8c9d0e1f"
name = "true-adventurer-adventure"

[assets]
# The CC0 Poly Haven rock scan already shipped with brick 23.
"2b5e7d10-0000-4000-8000-0000000000c1" = "models/rock_cc0.gltf"
# The NPC rig (B6): Quaternius Universal Animation Library mannequin, CC0
# — 43 in-place clips, 65 joints, authored in meters. Same asset GUID as
# the B2 fox it replaced: the graph records didn't move (§5 layering).
"2b5e7d10-0000-4000-8000-0000000000e0" = "models/UAL1_Standard.glb"

# --- World structure (chantier 2, B1) ---------------------------------------

[[records]]
form = "3c6f8e20-0000-4000-8000-000000000001"
type = "WorldspaceForm"
new = true
[records.fields]
editorId = "Overworld"
cellSize = 64.0

# The demo cell (x 0-64, z 320-384) holds the rocks, the NPC and its
# patrol markers.
[[records]]
form = "3c6f8e20-0000-4000-8000-000000000005"
type = "CellForm"
new = true
[records.fields]
editorId = "OverworldC0x5"
worldspace = "3c6f8e20-0000-4000-8000-000000000001"
gridX = 0
gridY = 5

# Two more authored cells east of the demo area — the pop-in proof lives
# in the farthest one.
[[records]]
form = "3c6f8e20-0000-4000-8000-000000000015"
type = "CellForm"
new = true
[records.fields]
editorId = "OverworldC1x5"
worldspace = "3c6f8e20-0000-4000-8000-000000000001"
gridX = 1
gridY = 5

[[records]]
form = "3c6f8e20-0000-4000-8000-000000000025"
type = "CellForm"
new = true
[records.fields]
editorId = "OverworldC2x5"
worldspace = "3c6f8e20-0000-4000-8000-000000000001"
gridX = 2
gridY = 5

