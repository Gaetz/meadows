# True Adventurer — the 3D gameplay plugin (chantier 1, brick B1).
# An ordinary plugin (§5): everything the LandscapeScene spawns comes from
# these records — StaticForm props here, the NPC and its appearance in the
# later bricks. Loaded after landscape.toml; it may reference that plugin's
# asset guids (assets layer per guid, like fields).
#
# B1 convention: ReferenceForm.position.y is an offset ABOVE the terrain at
# (x, z) — the scene grounds every spawned prop (hand-authored heights come
# with the level editor, chantier 2).

[plugin]
id = "7c9e2f40-3a1b-4c8d-9e5f-6a7b8c9d0e1f"
name = "true-adventurer-adventure"

[assets]
# The CC0 Poly Haven rock scan already shipped with brick 23.
"2b5e7d10-0000-4000-8000-0000000000c1" = "models/rock_cc0.gltf"
# The CC0 rigged sample (skeleton + Survey/Walk/Run clips), B2 proof; the
# demo's real humanoid replaces this file in B6 without touching records.
"2b5e7d10-0000-4000-8000-0000000000e0" = "models/character_cc0.glb"

# --- Materials ------------------------------------------------------------

# Untextured (albedoTexture = 0 -> white): the tint does the talking.
[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000c2"
type = "MaterialForm"
new = true
[records.fields]
editorId = "RockMossMaterial"
tint = [0.45, 0.62, 0.38, 1.0]
emissive = 0.0

# Textured: reuses the landscape plugin's albedo asset guid — proves the
# cross-plugin asset layering on the mesh path.
[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000c3"
type = "MaterialForm"
new = true
[records.fields]
editorId = "RockPaintedMaterial"
albedoTexture = "1a4d5c00-0000-4000-8000-0000000000a1"
tint = [1.0, 1.0, 1.0, 1.0]
emissive = 0.0

# --- Statics ---------------------------------------------------------------

[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000c4"
type = "StaticForm"
new = true
[records.fields]
editorId = "MossyRock"
displayName = "Mossy rock"
model = "2b5e7d10-0000-4000-8000-0000000000c1"
material = "2b5e7d10-0000-4000-8000-0000000000c2"

[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000c5"
type = "StaticForm"
new = true
[records.fields]
editorId = "PaintedRock"
displayName = "Painted rock"
model = "2b5e7d10-0000-4000-8000-0000000000c1"
material = "2b5e7d10-0000-4000-8000-0000000000c3"

# --- The player (B5.5) ------------------------------------------------------
# The player IS a character (docs/STATS.md): an ActorForm spawned like any
# actor — full stat sheet, GAS. The first-person controller reads the
# DERIVED movementSpeed/acceleration (injuries and buffs genuinely change
# how you move) and pays sprint through a GameplayEffect (§2.9).

[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000a0"
type = "ActorForm"
new = true
[records.fields]
editorId = "Player"
displayName = "The Adventurer"
maxHealth = 100.0

[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000a1"
type = "ReferenceForm"
new = true
[records.fields]
baseForm = "2b5e7d10-0000-4000-8000-0000000000a0"
position = [33.0, 0.0, 367.0]

# Sprint pays energy: one instant tick every half second while sprinting.
# The energy spend pauses regen for a beat (default), like any exertion.
[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000a2"
type = "EffectForm"
new = true
[records.fields]
editorId = "SprintCost"
attribute = "energy"
op = "add"
magnitude = -1.5

# Dev-test debuff: halves movementSpeed for 10 s — the visible proof that
# the controller obeys the stat pipeline (a real leg injury does the same).
[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000a3"
type = "EffectForm"
new = true
[records.fields]
editorId = "TestLegWound"
attribute = "movementSpeed"
op = "multiply"
magnitude = 0.5
duration = "duration"
durationSeconds = 10.0

# --- Character animation (B3): clips + locomotion graph --------------------
# Clips point INTO the glTF asset by animation name; states/transitions are
# CHILD records of the graph (a mod adds a state or retunes a threshold by
# adding/patching one record). referenceSpeed = anti-foot-sliding (§ no
# root motion): playback rate scales by entitySpeed / referenceSpeed.

[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000e1"
type = "AnimClipForm"
new = true
[records.fields]
editorId = "CharIdle"
asset = "2b5e7d10-0000-4000-8000-0000000000e0"
animationName = "Survey"

[[records]]
form = "2b5e7d10-0000-4000-8000-0000000000e2"
