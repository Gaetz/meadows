# --- FOLLOWERS É4: recrutement conditionnel + affinité -----------------------
# Maela, the healer: THE conditions demo. Her recruit option requires
# FollowerAffinityAtLeast 10 (the É4 evaluator clause reading the DIALOGUE
# PARTNER's FollowerState) AND AttributeAtLeast level 2 (the É0 minimal
# level — the player boots at 1). Two SIBLING refusal options carry the
# hint for the failing condition (negate combinations — the evaluator ANDs
# clauses per option, so exactly one of the three shows):
