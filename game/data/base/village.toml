# True Adventurer — the village plugin (chantier 2 B6/B7).
# A SECOND content plugin on top of landscape+adventure (§5 layering in
# action): the Quaternius Medieval Village kit (CC0, dev-provided), a
# leveled terrain pad, a house shell in the Overworld and its INTERIOR
# worldspace, two doors linking them.
#
# Authoring conventions:
#  - kit building modules: snapToGround = false, ABSOLUTE y (the pad is
#    leveled to 134.6 m by terrain/village_pad_0_5.ter);
#  - props (crates, wagon...): snapToGround = true, y = offset above soil;
#  - interior worldspace: its own absolute frame, room anchored at (8,0,8).
# House anchor (exterior): (52, 134.6, 362). Wall modules are 2 m wide,
# 3.12 m tall; the house is 4 m (x) by 8 m (z).

[plugin]
id = "9e1b3d50-4c2a-4f6b-8d7e-1a2b3c4d5e6f"
name = "true-adventurer-village"

[assets]
# Kit modules (Quaternius Medieval Village Mega Kit, CC0).
"4d7a9b30-0000-4000-8000-0000000000a1" = "models/kit/MedievalVillageMegaKit/glTF/Floor_WoodDark.gltf"
"4d7a9b30-0000-4000-8000-0000000000a2" = "models/kit/MedievalVillageMegaKit/glTF/Wall_Plaster_Straight.gltf"
"4d7a9b30-0000-4000-8000-0000000000a3" = "models/kit/MedievalVillageMegaKit/glTF/Wall_Plaster_Door_Flat.gltf"
"4d7a9b30-0000-4000-8000-0000000000a4" = "models/kit/MedievalVillageMegaKit/glTF/Wall_Plaster_Window_Wide_Flat2.gltf"
"4d7a9b30-0000-4000-8000-0000000000a5" = "models/kit/MedievalVillageMegaKit/glTF/Roof_RoundTiles_4x8.gltf"
"4d7a9b30-0000-4000-8000-0000000000a6" = "models/kit/MedievalVillageMegaKit/glTF/Roof_Front_Brick4.gltf"
"4d7a9b30-0000-4000-8000-0000000000a7" = "models/kit/MedievalVillageMegaKit/glTF/Door_1_Flat.gltf"
"4d7a9b30-0000-4000-8000-0000000000a8" = "models/kit/MedievalVillageMegaKit/glTF/Prop_Crate.gltf"
"4d7a9b30-0000-4000-8000-0000000000a9" = "models/kit/MedievalVillageMegaKit/glTF/Prop_Wagon.gltf"
