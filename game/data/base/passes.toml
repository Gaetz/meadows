# Mountain passes between bounded maps (chantier CARTES M4.2): each pass
# is a pair of PERSISTENT trigger volumes (no cell — they must exist
# whatever the streaming does) whose Lua asks travelToMap with an
# arrival point on the FAR side of the crossing, 400 m past the twin
# trigger so the arrival never bounces back.
#
# Col de l'Est — a genuine SADDLE of the border range on line x = 24576
# (map (0,0) <-> map (1,0), hashed style Ridges): crossing ~680 m at
# z ~ 13280, both approaches mountain flanks (~350-460 m at +-1.4 km) —
# picked by colness (low crossing AND high shoulders), not raw minimum,
# which had landed on a cliff above a lake basin. South of z ~ 5000 the
# range tapers into the coast (open strait, no pass).

[plugin]
id = "c01dea55-0000-4000-8000-0000000000ff"
name = "true-adventurer-passes"

[[records]]
form = "c01dea55-0000-4000-8000-000000000001"
type = "TriggerForm"
new = true
[records.fields]
editorId = "ColEstAller"
halfExtents = [80.0, 350.0, 350.0]
script = "travelToMap(1, 0, 24976.0, 13280.0)"

[[records]]
form = "c01dea55-0000-4000-8000-000000000002"
type = "ReferenceForm"
new = true
[records.fields]
baseForm = "c01dea55-0000-4000-8000-000000000001"
position = [24496.0, 460.0, 13280.0]

[[records]]
form = "c01dea55-0000-4000-8000-000000000003"
type = "TriggerForm"
new = true
[records.fields]
editorId = "ColEstRetour"
halfExtents = [80.0, 350.0, 350.0]
script = "travelToMap(0, 0, 24176.0, 13280.0)"

[[records]]
form = "c01dea55-0000-4000-8000-000000000004"
type = "ReferenceForm"
new = true
[records.fields]
baseForm = "c01dea55-0000-4000-8000-000000000003"
position = [24656.0, 520.0, 13280.0]
