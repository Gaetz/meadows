# Mountain passes between bounded maps.
#
# Crossing a map line is AUTOMATIC since chantier PAYSAGE N1: the scene
# switches maps when the player (or the free camera) leaves the active
# rect (LandscapeScene, the travel path with its veil). Authored passes
# are no longer needed for travel; this plugin stays as the home of
# hand-placed crossings a mod may still script with
#   travelToMap(mapX, mapZ, arrivalX, arrivalZ)
# from a persistent TriggerForm (no cell). The former « Col de l'Est »
# pair sat on the old 24 576 m line x = 24576 and was removed with the
# 8 km maps.

[plugin]
id = "c01dea55-0000-4000-8000-0000000000ff"
name = "true-adventurer-passes"
