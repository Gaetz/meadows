# True Adventurer — landscape & lighting tuning.
# An ordinary plugin (§5): mods patch any field below, last writer wins per
# field. First slice of the base.toml split.

[plugin]
id = "0a3f9c1e-5b71-4d2a-9c64-8e21d7b3f0a2"
name = "true-adventurer-landscape"

# H8 proof asset: the demo cube's albedo (reuses a base texture file under
# its own asset guid — assets layer per guid like fields, §5).
# The terrain_*.mtex arrays are the cooked splat material library
# (tools/cooker cook-terrain-materials; docs/AUDIT/TERRAIN-TEXTURING.md).
[assets]
"1a4d5c00-0000-4000-8000-0000000000a1" = "textures/iron_sword.png"
"18021676-1e56-4758-8859-3dbef5b6ec8c" = "textures/terrain/terrain_albedo.mtex"
"ed8af881-93d9-4c9f-964c-24714ff4473e" = "textures/terrain/terrain_normal.mtex"
"a2d5eb11-1a53-441c-b04c-591fdadf59f2" = "textures/terrain/terrain_orm.mtex"
"ee6aae6c-1520-4941-8e8c-29cca4857a97" = "textures/terrain/terrain_height.mtex"
# Scanned props (Poly Haven CC0, docs/PAYSAGE.md §1.7 palier 1): override the
# vegetation rock/debris variants; decimated + normalized at load.
"4f018fc5-80ee-4601-a74d-d1bff315ee76" = "models/scans/stone_01/stone_01.gltf"
"65de4305-9eda-48ba-a87c-57aff4606164" = "models/scans/rock_moss_set_01/rock_moss_set_01.gltf"
"179b7c4b-708b-4ce0-ba8b-2d9fad6d9e1b" = "models/scans/tree_stump_01/tree_stump_01.gltf"
"52f8af61-88f5-4c3d-accf-aca86850f787" = "models/scans/dead_tree_trunk/dead_tree_trunk.gltf"
"8777c167-0930-4bbc-8820-a35b49229beb" = "models/scans/rock_boulder_dry/rock_boulder_dry.gltf"
"e6ed977e-44d4-48d6-ae11-97fd1024b363" = "models/scans/boulder_01/boulder_01.gltf"
"a28b58a1-e436-4f9a-8fc2-b248c0c228ad" = "models/plants/grass_medium_01/grass_medium_01.gltf"
"85b644a7-f52e-4e33-a856-e72463c403fa" = "models/plants/fern_02/fern_02.gltf"
"0e611ef4-69d1-40b5-b7c8-6b7884027caa" = "models/plants/dandelion_01/dandelion_01.gltf"
"292b350b-99e7-482b-b9f6-0e993a69dc91" = "models/plants/shrub_04/shrub_04.gltf"
"52035a3f-8246-419a-aa69-a686b0c2e834" = "textures/bark/bark_brown_02_diff_1k.jpg"
"8244825d-a9a7-4a30-a8e7-996670193884" = "textures/bark/pine_bark_diff_1k.jpg"

[[records]]
form = "1a4d5c00-0000-4000-8000-000000000001"
type = "LandscapeTuningForm"
new = true
[records.fields]
editorId = "LandscapeTuning"

# The worldspace the game boots into (adventure.toml's overworld) —
# resolved by GUID, never by editorId.
startWorldspace = "3c6f8e20-0000-4000-8000-000000000001"

# --- Terrain shape ------------------------------------------------------
terrainSeed = 1337
hillWavelength = 500.0      # meters per base noise octave
hillAmplitude = 75.0        # rolling-hill height range (+/- m)
terrainOctaves = 5
terrainLacunarity = 2.0
terrainGain = 0.5
mountainWavelength = 2000.0
mountainAmplitude = 270.0
mountainMaskLow = 0.45      # mask noise below this -> plains
mountainMaskHigh = 0.75     # above this -> full mountains
seaLevel = 21.0             # meters
sandboxTerrain = true       # boot world: sandbox (the menu's Story button switches back)
# Sandbox elevation recurve — outputs of the altitude curve at inputs
# 1/4, 1/2, 3/4 (0.25/0.5/0.75 = identity). Lower mid = flatter plains
# with sharper rises. Clear terrain-cache/<seed> after changing.
terrainRecurveLow = 0.25
terrainRecurveMid = 0.5
terrainRecurveHigh = 0.75

# --- Terrain materials ---------------------------------------------------
snowLine = 165.0            # story-world snow altitude (m)
# Sandbox snow: base line 900 + biome accents + the engine's ±80 m wander
# field. Calibrated against the pre-M4 look (snow coverage diagnostic:
# ~6 % full-snow land, mountains 600 m+); raise/lower ~50 m per notch.
sandboxSnowLine = 900.0
coniferTreeType = "conifer" # species of the high tree slots (3-4)
bushTreeType = "bush"       # colonized bush species (legacy blobs if empty)
# 1.0 keeps the tree line at ~900 m — where it sat when the snow base was
# 1100 x 0.82; the wander field lets snow patches dip into the forest edge.
treeLineFactor = 1.0
splatUvScale = 0.25         # ground texture tiles per meter
splatBlendDepth = 0.15      # height-blend band between layers (0 = plain blend)
terrainTintStrength = 0.3   # macro tint strength (0 = off, keep <= ~0.4)
splatDetailFade = 24.0      # near-field detail-normal fade end (m, 0 = off)
pomDistance = 12.0          # parallax occlusion reach (m, 0 = off)
splatVariety = 0.5          # anti-repetition second tap strength (0 = off)
pomShadowStrength = 0.6     # POM self-shadow (crevices darken sun-side)
pomDepth = 0.03             # parallax relief depth (uv units)
# Cooked splat material arrays (Vulkan-only; empty/missing = procedural tiles).
terrainAlbedoArray = "18021676-1e56-4758-8859-3dbef5b6ec8c"
terrainNormalArray = "ed8af881-93d9-4c9f-964c-24714ff4473e"
terrainOrmArray = "a2d5eb11-1a53-441c-b04c-591fdadf59f2"
terrainHeightArray = "ee6aae6c-1520-4941-8e8c-29cca4857a97"

# --- Fog / atmosphere ----------------------------------------------------
fogDensity = 0.0010          # thinner: the 2-3 km ring must be visible
fogHeightFalloff = 0.02     # 1/m — how fast fog thins with altitude
fogLowBoost = 1.6           # extra density near sea level (misty valleys)
fogStart = 300.0            # meters of clear air before fog begins
fogSunPhase = 8.0           # fog sun-scatter lobe tightness (docs/RENDERING.md)

# --- Post processing -----------------------------------------------------
exposure = 1.0
bloomIntensity = 0.35
godRayIntensity = 0.6
volumetricIntensity = 1.0   # volumetric light shafts
# ssaoStrength: retired 2026-07-10 (screen-space AO removed)

# --- Clouds --------------------------------------------------------------
cloudCoverage = 0.38        # 0 = clear sky, 1 = overcast
cloudShadowStrength = 0.95
cloudHeight = 950.0         # cloud layer altitude (m)
cloudScale = 0.0011         # pattern frequency (1/m)

# --- Interiors (chantier 6 B1) --------------------------------------------
interiorAmbient = [0.16, 0.15, 0.14]  # base ambient in interior cells
interiorDaylightWeight = 0.6          # 0 = constant, 1 = full outside coupling

# --- Grading (renderer brick 28, chantier 6 B3) ----------------------------
gradeVibrance = 0.3    # weighted saturation boost (0 = off)
gradeSplitTone = 0.35  # cool shadows / warm highlights (0 = off)
gradeContrast = 1.06   # pivot 0.5 (1 = neutral)

# --- Auto-exposure (renderer brick 29, chantier 6 B4) -----------------------
autoExposureMin = 0.4  # adapted exposure clamp (bright scenes)
autoExposureMax = 2.5  # adapted exposure clamp (dark scenes/interiors)

# --- Stylized lighting ramp (stylized.glsl; live in the render panel) -------
stylizedDiffuseEdge0Start = 0.02  # terminator smoothstep
stylizedDiffuseEdge0End = 0.09
stylizedDiffuseEdge1Start = 0.32  # full-light smoothstep
stylizedDiffuseEdge1End = 0.4
stylizedHalfTone = 0.6            # mid plateau level
stylizedShadowStart = 0.45        # CSM snap window (BotW flat pools) —
stylizedShadowEnd = 0.55          # inert while stylized A/B is off (default)
stylizedShadowFloor = 0.0         # raise to keep shadow pools readable

# --- Shadows --------------------------------------------------------------
shadowResolution = 2048           # CSM texels per cascade (1024/2048/4096)
froxelFog = true                  # V4/H4 froxel volume (off = 2D march)
froxelTemporalBlend = 0.02        # EMA: current fraction/frame (1 = off)
froxelDustNoise = 0.75            # dust wisps: 0 uniform, 1 sparse sheets
interiorDustDensity = 0.025       # uniform dust indoors (H4)

# --- Biomes (palette contract with the sandbox generator:
#     0 temperate/neutral, 1 arid, 2 alpine, 3 tundra, 4 subalpine,
#     5 steppe) ---------------------------------------------------------
