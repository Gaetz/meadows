# --- The zones' archetype table (docs/PAYSAGE.md §4 bis, POI-CATALOGUE.md §E):
# one ZoneArchetypeForm per nature a 1 km zone may take, ordered by rank;
# conditions on the world sample at the zone's site (etage, massif, coast,
# moisture in [0,1]); the grammar draws the zone (relief, benches, crests,
# palette, its small landform `piece`: 1 knoll, 2 clearing, 3 pond, 4 rock
# knob, 5 grove mound). Mirrors the C++ default table (ZonePlan.cpp).

[[records]]
form = "7a0e0000-0000-4000-8000-000000000001"
type = "ZoneArchetypeForm"
new = true
[records.fields]
