# True Adventurer — landscape & lighting tuning.
# An ordinary plugin (§5): mods patch any field below, last writer wins per
# field. First slice of the base.toml split.

[plugin]
id = "0a3f9c1e-5b71-4d2a-9c64-8e21d7b3f0a2"
name = "true-adventurer-landscape"

# H8 proof asset: the demo cube's albedo (reuses a base texture file under
# its own asset guid — assets layer per guid like fields, §5).
[assets]
"1a4d5c00-0000-4000-8000-0000000000a1" = "textures/iron_sword.png"

[[records]]
form = "1a4d5c00-0000-4000-8000-000000000001"
type = "LandscapeTuningForm"
new = true
[records.fields]
editorId = "LandscapeTuning"

# --- Terrain shape ------------------------------------------------------
terrainSeed = 1337
hillWavelength = 400.0      # meters per base noise octave
hillAmplitude = 50.0        # rolling-hill height range (+/- m)
mountainWavelength = 1500.0
mountainAmplitude = 180.0
seaLevel = 14.0             # meters

# --- Terrain materials ---------------------------------------------------
snowLine = 110.0            # snow above this altitude (m)
splatUvScale = 0.25         # ground texture tiles per meter

# --- Fog / atmosphere ----------------------------------------------------
fogDensity = 0.0014
fogHeightFalloff = 0.02     # 1/m — how fast fog thins with altitude
fogLowBoost = 1.6           # extra density near sea level (misty valleys)
fogStart = 300.0            # meters of clear air before fog begins

# --- Post processing -----------------------------------------------------
exposure = 1.0
bloomIntensity = 0.35
godRayIntensity = 0.6
volumetricIntensity = 1.0   # volumetric light shafts
# ssaoStrength: retired 2026-07-10 (screen-space AO removed)

# --- Clouds --------------------------------------------------------------
cloudCoverage = 0.38        # 0 = clear sky, 1 = overcast
cloudShadowStrength = 0.7
cloudHeight = 520.0         # cloud layer altitude (m)
cloudScale = 0.0011         # pattern frequency (1/m)

# --- Interiors (chantier 6 B1) --------------------------------------------
interiorAmbient = [0.16, 0.15, 0.14]  # constant ambient in interior cells

# --- Grading (renderer brick 28, chantier 6 B3) ----------------------------
gradeVibrance = 0.3    # weighted saturation boost (0 = off)
gradeSplitTone = 0.35  # cool shadows / warm highlights (0 = off)
gradeContrast = 1.06   # pivot 0.5 (1 = neutral)

# --- Auto-exposure (renderer brick 29, chantier 6 B4) -----------------------
autoExposureMin = 0.4  # adapted exposure clamp (bright scenes)
autoExposureMax = 2.5  # adapted exposure clamp (dark scenes/interiors)

# H8 proof: MaterialForm -> textured stylized mesh (the renderer-gameplay
# contract). The LandscapeScene draws one cube with this material near the
# spawn point; patch tint/emissive to see the data drive the pixels.
[[records]]
form = "1a4d5c00-0000-4000-8000-0000000000b1"
type = "MaterialForm"
new = true
[records.fields]
editorId = "DemoCubeMaterial"
albedoTexture = "1a4d5c00-0000-4000-8000-0000000000a1"
tint = [1.0, 0.95, 0.85, 1.0]
emissive = 0.0

