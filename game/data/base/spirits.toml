# The nine spirits (chantier ESPRITS, docs/CHANTIER-ESPRITS.md): one
# SpiritForm per spirit, the interaction rule table (SpiritRuleForm — the
# actor is ALWAYS a spirit), the surface material classes the fields read,
# and authored world sources (SpiritSourceForm — the same record a save
# emits for a spring the player cast).
#
# Three triads, each a shifumi keyed to the resonance channels:
#   Onyx (matter) > Amber (energy) > Garnet (spirit) > Onyx
#   1: Vegetation (Tree) > Light (Moon) > Darkness (Black)
#   2: Earth (Hammer, blunt) > Lightning (Blade, slashing) > Psy (Mirror, piercing)
#   3: Water/cold > Fire > Wind (breath)
# The shifumi is the default rule; records below refine it.

[plugin]
id = "5b1e1700-0000-4000-8000-0000000000ff"
name = "true-adventurer-spirits"

