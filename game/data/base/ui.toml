# Base-game UI screens (chantier 4). Each record names a screen and points
# at its document; the documents themselves live in ui/ and layer by path
# (a mod ships ui/hud.rml to reskin the HUD, or patches `document` here to
# swap it for another file).

[plugin]
id = "5e8bac40-0000-4000-8000-000000000000"
name = "true-adventurer-ui"

[[records]]
form = "5e8bac40-0000-4000-8000-000000000001"
type = "UiScreenForm"
new = true
[records.fields]
editorId = "ScreenHud"
screen = "hud"
document = "hud.rml"
overlay = true

[[records]]
form = "5e8bac40-0000-4000-8000-000000000002"
type = "UiScreenForm"
new = true
[records.fields]
editorId = "ScreenInventory"
screen = "inventory"
document = "inventory.rml"
modal = true

[[records]]
form = "5e8bac40-0000-4000-8000-000000000003"
type = "UiScreenForm"
new = true
[records.fields]
editorId = "ScreenContainer"
screen = "container"
document = "container.rml"
modal = true

[[records]]
form = "5e8bac40-0000-4000-8000-000000000004"
type = "UiScreenForm"
new = true
[records.fields]
editorId = "ScreenDialogue"
screen = "dialogue"
document = "dialogue.rml"
modal = true

# The gold currency (chantier 4 B5): an ordinary MISC item — no parallel
# money system, the barter screen just moves coins like any stack.
[[records]]
form = "5e8bac40-0000-4000-8000-000000000010"
type = "MiscItemForm"
new = true
[records.fields]
editorId = "GoldCoin"
displayName = "Gold"
weight = 0.0
goldValue = 1
